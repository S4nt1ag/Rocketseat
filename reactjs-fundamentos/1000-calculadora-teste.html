<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik&display=swap"
      rel="stylesheet"
    />
    <title>Rocketseat - React.js - Fundamentos</title>

    <style type="text/tailwindcss">
      @theme {
        --text: #ebebeb;
        --text-secondary: #6b6b6b;
        --primary: #462878;
        --secondary: #6a4ab5;
        --background: #2d2a37;

        --gradient:
          180deg, rgba(0, 0, 0, 0.05) 0%, rgba(255, 255, 255, 0.05) 100%;

        --gradient-hover:
          180deg, rgba(0, 0, 0, 0.1) 0%, rgba(255, 255, 255, 0.1) 100%;

        --shadow:
          0px 11px 7px 0px rgba(0, 0, 0, 0.01),
          0px 7px 7px 0px rgba(0, 0, 0, 0.04),
          0px 4px 6px 0px rgba(0, 0, 0, 0.1),
          0px 2px 4px 0px rgba(0, 0, 0, 0.26),
          0px 0px 2px 0px rgba(0, 0, 0, 0.29),
          0px 2px 3px 0px rgba(255, 255, 255, 0.06) inset;

        --font-sans: "Rubik", sans-serif;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-linear-[180deg,_#807ECE_100%,_#8E7ECE_100%] text-(--text) font-(--font-sans)"
  >
    <div id="root"></div>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const textVariants = {
        default: "text-xl",
        muted: "text-xl text-(--text-secondary)",
        heading: "text-2xl",
        blast: "text-3xl",
      };

      function Text({
        as = "span",
        variant = "default",
        className,
        children,
        ...props
      }) {
        return React.createElement(
          as,

          {
            className: `${textVariants[variant]} ${className ? className : ""}`,
            ...props,
          },
          children,
        );
      }

      const buttonVariants = {
        default: "bg-(--background)",
        primary: "bg-(--primary)",
        secondary: "bg-(--secondary)",
      };

      function Button({ variant = "default", className, children, ...props }) {
        return (
          <Text
            as="button"
            variant="heading"
            className={`
              flex items-center justify-center 
              rounded-xl p-3 cursor-pointer text-(--text) 
              bg-linear-(--gradient) 
              hover:bg-linear-(--gradient-hover) 
              shadow-(--shadow) 
              ${buttonVariants[variant]}
              ${className ? className : ""}`}
            {...props}
          >
            {children}
          </Text>
        );
      }

      function Card({ children, className, ...props }) {
        return (
          <div
            className={`
            bg-(--background) shadow-(--shadow) rounded-2xl ${className ? className : ""}`}
            {...props}
          >
            {children}
          </div>
        );
      }

      function CalculatorDisplay({ operation, result }) {
        return (
          <div
            className={`
              flex flex-col 
              gap-2 
              px-[1.375rem] 
              cursor-default 
              select-none`}
          >
            <Text
              as="div"
              variant="muted"
              className={`
                flex items-center justify-end`}
            >
              {operation}
            </Text>
            <div className={`flex items-center justify-between`}>
              <Text variant="muted"> = </Text>
              <Text variant="blast"> {result}</Text>
            </div>
          </div>
        );
      }

      function calculateResult(numberOne, operation, numberTwo) {
        const first = Number(String(numberOne).replace(",", "."));
        const second = Number(String(numberTwo).replace(",", "."));
        switch (operation) {
          case "+":
            return formatResult(first + second);
          case "-":
            return formatResult(first - second);
          case "*":
            return formatResult(first * second);
          case "/":
            return second === 0 ? "Erro" : formatResult(first / second);
          default:
            return "0";
        }
      }

      function formatResult(value) {
        if (!Number.isFinite(value)) return "Erro";
        return String(Number(value.toPrecision(12))).replace(".", ",");
      }

      function Calculator({ onCalculate }) {
        const [display, setDisplay] = React.useState("0");
        const [storedValue, setStoredValue] = React.useState(null);
        const [operation, setOperation] = React.useState(null);
        const [waitingForOperand, setWaitingForOperand] = React.useState(false);
        const [expression, setExpression] = React.useState("");

        function enterDigit(digit) {
          const nextDisplay =
            waitingForOperand || display === "Erro"
              ? digit
              : display === "0"
                ? digit
                : `${display}${digit}`;
          setDisplay(nextDisplay);
          setWaitingForOperand(false);
          setExpression(
            operation && storedValue !== null
              ? `${storedValue} ${operation} ${nextDisplay}`
              : "",
          );
        }

        function enterDecimal() {
          const nextDisplay =
            waitingForOperand || display === "Erro"
              ? "0,"
              : display.includes(",")
                ? display
                : `${display},`;
          setDisplay(nextDisplay);
          setWaitingForOperand(false);
          setExpression(
            operation && storedValue !== null
              ? `${storedValue} ${operation} ${nextDisplay}`
              : "",
          );
        }

        function selectOperation(nextOperation) {
          if (display === "Erro") return;

          let nextStoredValue = storedValue;
          let nextDisplay = display;

          if (operation && !waitingForOperand && storedValue !== null) {
            nextDisplay = calculateResult(storedValue, operation, display);
            nextStoredValue = nextDisplay;
            setDisplay(nextDisplay);
          } else if (nextStoredValue === null) {
            nextStoredValue = display;
          }

          setStoredValue(nextStoredValue);
          setOperation(nextOperation);
          setWaitingForOperand(true);
          setExpression(`${nextStoredValue} ${nextOperation}`);
        }

        function calculate() {
          if (!operation || storedValue === null || display === "Erro") return;

          const result = calculateResult(storedValue, operation, display);
          const completedExpression = `${storedValue} ${operation} ${display}`;
          setDisplay(result);
          setExpression(completedExpression);
          setStoredValue(null);
          setOperation(null);
          setWaitingForOperand(true);
          if (result !== "Erro") {
            onCalculate(`${completedExpression} = ${result}`);
          }
        }

        function clearAll() {
          setDisplay("0");
          setStoredValue(null);
          setOperation(null);
          setWaitingForOperand(false);
          setExpression("");
        }

        function clearEntry() {
          setDisplay("0");
          setWaitingForOperand(false);
          setExpression(
            operation && storedValue !== null
              ? `${storedValue} ${operation}`
              : "",
          );
        }

        function enterPercent() {
          if (display === "Erro") return;
          const nextDisplay = formatResult(
            Number(display.replace(",", ".")) / 100,
          );
          setDisplay(nextDisplay);
          setWaitingForOperand(false);
          setExpression(
            operation && storedValue !== null
              ? `${storedValue} ${operation} ${nextDisplay}`
              : "",
          );
        }

        return (
          <Card
            className={`
              flex 
              flex-col 
              gap-[1.625rem] 
              w-[22.25rem] 
              pt-14 
              px-8 
              pb-8`}
          >
            <CalculatorDisplay
              operation={expression}
              result={display}
            />

            <div
              className={`
              flex 
              flex-col
              gap-3
              `}
            >
              <div className={`flex gap-3`}>
                <Button
                  className="w-16 h-16"
                  onClick={clearEntry}
                >
                  CE
                </Button>
                <Button
                  className="flex-1 h-16"
                  onClick={clearAll}
                >
                  C
                </Button>
                <Button
                  variant="primary"
                  className="w-16 h-16"
                  onClick={enterPercent}
                >
                  %
                </Button>
                <Button
                  variant="primary"
                  className="w-16 h-16"
                  onClick={() => selectOperation("/")}
                >
                  /
                </Button>
              </div>
              <div className={`flex gap-3`}>
                <Button className="w-16 h-16" onClick={() => enterDigit("7")}>
                  7
                </Button>
                <Button className="w-16 h-16" onClick={() => enterDigit("8")}>
                  8
                </Button>
                <Button className="w-16 h-16" onClick={() => enterDigit("9")}>
                  9
                </Button>
                <Button
                  variant="primary"
                  className="w-16 h-16"
                  onClick={() => selectOperation("*")}
                >
                  *
                </Button>
              </div>
              <div className={`flex gap-3`}>
                <Button className="w-16 h-16" onClick={() => enterDigit("4")}>
                  4
                </Button>
                <Button className="w-16 h-16" onClick={() => enterDigit("5")}>
                  5
                </Button>
                <Button className="w-16 h-16" onClick={() => enterDigit("6")}>
                  6
                </Button>
                <Button
                  variant="primary"
                  className="w-16 h-16"
                  onClick={() => selectOperation("-")}
                >
                  -
                </Button>
              </div>
              <div className={`flex gap-3`}>
                <Button className="w-16 h-16" onClick={() => enterDigit("1")}>
                  1
                </Button>
                <Button className="w-16 h-16" onClick={() => enterDigit("2")}>
                  2
                </Button>
                <Button className="w-16 h-16" onClick={() => enterDigit("3")}>
                  3
                </Button>
                <Button
                  variant="primary"
                  className="w-16 h-16"
                  onClick={() => selectOperation("+")}
                >
                  +
                </Button>
              </div>
              <div className={`flex gap-3`}>
                <Button className="flex-1 h-16" onClick={() => enterDigit("0")}>
                  0
                </Button>
                <Button className="w-16 h-16" onClick={enterDecimal}>
                  ,
                </Button>
                <Button variant="secondary" className="w-16 h-16" onClick={calculate}>
                  =
                </Button>
              </div>
            </div>
          </Card>
        );
      }

      function Operationhistory({ history }) {
        return (
          <Card
            className={`
            py-10
            px-8
            w-full
            `}
          >
            <Text as="h1" variant="heading" className="mb-4">
              Histórico de Operações
            </Text>

            <ul className="flex flex-col gap-3">
              {history.length === 0 ? (
                <Text as="li" variant="muted">Nenhuma operação</Text>
              ) : (
                history.map((item, index) => <Text as="li" key={index}>{item}</Text>)
              )}
            </ul>
          </Card>
        );
      }

      function App() {
        const [history, setHistory] = React.useState([]);

        return (
          <main
            className={`
            py-28 px-4 sm:px-10
            flex flex-col sm:flex-row
            items-center sm:items-stretch
            gap-2
            
            `}
          >
            <Calculator
              onCalculate={(item) => setHistory((current) => [item, ...current])}
            />
            <Operationhistory history={history} />
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
