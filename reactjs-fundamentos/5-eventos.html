<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocketseat - React.js - Fundamentos</title>
  </head>
  <body>
    <div id="root">
      <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
      <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
      <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

      <script type="text/babel">
        function Alert1() {
          function handleAlertClick(event) {
            console.log(event);
            alert("Você clicou no botão!");
          }

          return (
            <button type="button" onClick={handleAlertClick}>
              mostar alerta
            </button>
          );
        }

        function Alert2() {
          function handleAlertClick(event, message) {
            console.log(event);
            alert(message);
          }

          return (
            <button
              type="button"
              onClick={(event) =>
                handleAlertClick(
                  event,
                  "Esta é uma mensagem de alerta com parâmetro!",
                )
              }
            >
              mostrar alerta com parâmetro
            </button>
          );
        }

        function Alert3() {
          function handleAlertClick(event) {
            alert(event.target.previousElementSibling.value);
          }

          return (
            <div>
              <input type="text" placeholder="Digite algo..." />
              <button onClick={handleAlertClick}>
                Mostrar Alerta do campo de texto
              </button>
            </div>
          );
        }

        function App() {
          return (
            <main>
              <Alert1 />
              <Alert2 />
              <Alert3 />
            </main>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      </script>
    </div>
  </body>
</html>
