<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocketseat - React.js - Fundamentos</title>
  </head>
  <body>
    <div id="root">
      <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
      <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
      <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
      <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

      <script type="text/babel">

        const buttonVariants = {
          primary: "bg-purple-500",
          default: "bg-gray-500",
        }

        function Button({ children, className, variant = "default", ...props }) {
          return (
            <button className={`px-3 py-2 rounded-2xl text-white ${buttonVariants[variant]} ${className}`} {...props}>
              {children}
              
            </button>
          );
        }

        function App() {
          return (
            <main className="flex gap-2 p-3">
              <Button variant="primary" className='mr-10'>Botão 1</Button>
              <Button >Botão 2</Button>
            </main>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      </script>
    </div>
  </body>
</html>
